name = "stemlearn-mcp"
main = "src/worker.ts"
compatibility_date = "2025-11-01"
# nodejs_compat: see config.ts. global_fetch_strictly_public: required by
# @cloudflare/workers-oauth-provider's Client ID Metadata Document (CIMD)
# support for SSRF-safe outbound fetches of client metadata documents.
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# Legacy endpoints. Both stay enabled during the sunlearn-mcp rebrand so
# existing connected clients (on workers.dev, or on the old stemlearn-mcp
# custom domain) keep working — see src/oauth/issuer.ts for how each request
# is routed to the right issuer identity.
workers_dev = true

[[routes]]
pattern = "sunlearn-mcp.kefas.co.za"
custom_domain = true

[[routes]]
pattern = "stemlearn-mcp.kefas.co.za"
custom_domain = true

# Remote MCP transport (Streamable HTTP at /mcp), now OAuth 2.1-protected
# (src/oauth/provider.ts) with a legacy MCP_ACCESS_TOKEN static-bearer lane
# preserved during migration. Local stdio remains the primary supported
# deployment model. Secrets (MOODLE_URL, MOODLE_TOKEN, MCP_ACCESS_TOKEN,
# CREDENTIAL_ENCRYPTION_KEY) are set via `wrangler secret put` — never in
# this file.

# Per-user encrypted Moodle credentials (zero to five, one per SUNLearn site
# — src/sunlearn-sites.ts is the registry, not this file) + short-lived
# linking sessions (src/linking/*). database_id is filled in after
# `wrangler d1 create`.
[[d1_databases]]
binding = "DB"
database_name = "stemlearn-mcp-db"
database_id = "a7752258-92f5-4ce2-8f6b-519885c2c4d3"

# Required by @cloudflare/workers-oauth-provider for its own OAuth state
# (codes/tokens/clients/grants — tokens/secrets stored as hashes only, props
# AES-GCM-encrypted). Separate from and unrelated to our own D1 linking
# sessions/credentials above. namespace id is filled in after creation.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "fa0759f9be9e4ebaacb7c2061c42592f"

# Static assets (e.g. the copy-link-demo video embedded on the connect page).
# Served directly by Cloudflare for matching paths, bypassing the Worker
# script entirely — no route in src/ handles these.
[assets]
directory = "./public"

# Persist invocation logs so production exceptions can be investigated from
# the Cloudflare dashboard without requiring a live Wrangler tail session.
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true
