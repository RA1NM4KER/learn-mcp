name: Bug report
description: Report a reproducible problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [Local (stdio), Remote (Cloudflare Worker)]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Node version, MCP client, Moodle site type. Do not paste tokens or course content.
